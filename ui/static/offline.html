<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>AMUD — Offline</title>
  <meta name="theme-color" content="#cf6427">
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0a0b10;
      color: #e8eaef;
      text-align: center;
    }
    img { width: 72px; height: 72px; margin-bottom: 1rem; }
    h1 { font-size: 1.35rem; margin: 0 0 0.5rem; }
    p { margin: 0; color: #a0aabf; line-height: 1.5; max-width: 28rem; }
    button {
      margin-top: 1.5rem;
      min-height: 44px;
      padding: 0.65rem 1.25rem;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(207,100,39,0.18);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/static/AMUD-logo.png" alt="AMUD">
    <h1>You are offline</h1>
    <p>AMUD could not reach the server. Cached assets may still work after you reconnect.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
