<div id="category-tabs" style="display: flex; gap: 0.75rem; overflow-x: auto; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-color); margin-bottom: 0.5rem;">
    <button class="btn btn-secondary" 
            hx-get="/apps" 
            hx-target="#app-grid" 
            hx-swap="outerHTML"
            style="padding: 0.5rem 1.25rem; font-size: 0.85rem; border-radius: 0.5rem;">
        All
    </button>
    {{range .}}
    <button class="btn btn-secondary" 
            hx-get="/apps?category={{.}}" 
            hx-target="#app-grid" 
            hx-swap="outerHTML"
            style="padding: 0.5rem 1.25rem; font-size: 0.85rem; border-radius: 0.5rem;">
        {{.}}
    </button>
    {{end}}
</div>
