<div id="category-tabs">
    <button class="btn btn-secondary" 
            hx-get="/apps" 
            hx-target="#app-grid" 
            hx-swap="outerHTML">
        All
    </button>
    {{range .}}
    <button class="btn btn-secondary" 
            hx-get="/apps?category={{.}}" 
            hx-target="#app-grid" 
            hx-swap="outerHTML">
        {{.}}
    </button>
    {{end}}
</div>
