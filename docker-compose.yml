version: '3.8'

services:
  app:
    image: tradmss/amud-dashboard:latest
    container_name: amud_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/app/data/amud.db
      # Optional: set AMUD_SECRETS_KEY to a 32-byte base64url/hex key (otherwise data/.amud-secrets-key is created)
      # - AMUD_SECRETS_KEY=${AMUD_SECRETS_KEY}
      - PUID=${PUID:-99}
      - PGID=${PGID:-100}
      - AMUD_SOCKET_MODE=666
      - PORT=8000
      - AMUD_SOCKET_PATH=/var/run/amud/amud.sock
      - AMUD_AGENT_SECRET=${AMUD_AGENT_SECRET:?Set AMUD_AGENT_SECRET in .env or environment}
      - BIND_ADDR=0.0.0.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/app/data
      - amud_run:/var/run/amud

  agent:
    image: tradmss/amud-dashboard:latest
    container_name: amud_agent
    user: "0:0"
    entrypoint: ["/app/amud-agent"]
    # For host telemetry mapping (custom NICs / disk paths), use host network + bind mounts:
    # network_mode: host
    environment:
      - AMUD_SOCKET_PATH=/var/run/amud/amud.sock
      - AMUD_AGENT_SECRET=${AMUD_AGENT_SECRET:?Set AMUD_AGENT_SECRET in .env or environment}
      # Auto-enabled when /var/run/docker.sock is mounted; set AMUD_DOCKER=0 to disable
      - AMUD_DOCKER=${AMUD_DOCKER:-1}
      # Prefer agent-local PVE token — avoids plaintext over IPC (SEC-015)
      # - PVE_API_TOKEN=PVEAPIToken=root@pam!tokenid=secret
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - amud_run:/var/run/amud
      # :ro does not limit Docker API power — use AMUD_DOCKER=0 or a socket proxy for hardening
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Unraid / host disk mapping examples (uncomment with network_mode: host):
      # - /mnt/user:/mnt/user:ro
      # - /mnt/cache:/mnt/cache:ro
    restart: always

volumes:
  amud_run:
    name: amud_run
