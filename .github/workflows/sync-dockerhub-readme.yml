name: Sync Docker Hub README

on:
  push:
    branches:
      - main
    paths:
      - 'DOCKERHUB.md'
      - '.github/workflows/sync-dockerhub-readme.yml'
  workflow_dispatch:

jobs:
  sync:
    name: Push overview to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Update Docker Hub repository overview
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          HUB_TOKEN=$(curl -fsS -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          jq -n --rawfile body DOCKERHUB.md \
            '{description: "AMUD Dashboard — compiled Rust homelab cockpit with live Docker/Proxmox telemetry. Zero YAML.", full_description: $body}' | \
            curl -fsS -X PATCH \
              -H "Authorization: Bearer ${HUB_TOKEN}" \
              -H "Content-Type: application/json" \
              -d @- \
              "https://hub.docker.com/v2/repositories/tradmss/amud-dashboard/"
