name: Release AMUD

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build and Upload Release Assets
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Projects in Release Mode
        run: |
          GIT_TAG=${GITHUB_REF#refs/tags/} cargo build --release

      - name: Package UI Templates and Assets
        run: |
          tar -czf ui.tar.gz ui/

      - name: Generate SHA256 Checksums
        run: |
          sha256sum target/release/amud-server target/release/amud-agent ui.tar.gz > SHA256SUMS
          grep -qE '[[:space:]/]amud-server$' SHA256SUMS
          grep -qE '[[:space:]/]amud-agent$' SHA256SUMS
          grep -qE '[[:space:]/]ui\.tar\.gz$' SHA256SUMS

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: |
            target/release/amud-server
            target/release/amud-agent
            ui.tar.gz
            SHA256SUMS
            setup-amud.sh
            update-amud.sh
            uninstall-amud.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
