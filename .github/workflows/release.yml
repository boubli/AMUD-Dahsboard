name: Release AMUD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-binaries:
    name: Build ${{ matrix.server_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            server_name: amud-server
            agent_name: amud-agent
          - runner: ubuntu-24.04-arm
            server_name: amud-server-arm64
            agent_name: amud-agent-arm64
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Cargo Dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ matrix.server_name }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.server_name }}-cargo-

      - name: Build Projects in Release Mode
        run: |
          GIT_TAG=${GITHUB_REF#refs/tags/} cargo build --release

      - name: Stage release binaries
        run: |
          set -euxo pipefail
          staging="release-staging-${{ matrix.server_name }}"
          mkdir -p "$staging"
          cp target/release/amud-server "$staging/${{ matrix.server_name }}"
          cp target/release/amud-agent "$staging/${{ matrix.agent_name }}"
          ls -la "$staging/"

      - name: Upload binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.server_name }}-binaries
          path: release-staging-${{ matrix.server_name }}/

  build-ui:
    name: Package UI assets
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Package UI Templates and Assets
        run: tar -czf ui.tar.gz ui/

      - name: Upload UI archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-tarball
          path: ui.tar.gz

  publish-release:
    name: Create GitHub Release
    needs: [build-binaries, build-ui]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release-assets

      - name: Collect release files
        run: |
          set -euxo pipefail
          mkdir -p dist
          find release-assets -type f \( \
            -name 'amud-server' -o \
            -name 'amud-agent' -o \
            -name 'amud-server-arm64' -o \
            -name 'amud-agent-arm64' -o \
            -name 'ui.tar.gz' \
          \) -exec cp {} dist/ \;
          for asset in amud-server amud-agent amud-server-arm64 amud-agent-arm64 ui.tar.gz; do
            test -f "dist/$asset"
          done
          cd dist
          sha256sum amud-server amud-agent amud-server-arm64 amud-agent-arm64 ui.tar.gz > SHA256SUMS
          grep -qE '[[:space:]/]amud-server$' SHA256SUMS
          grep -qE '[[:space:]/]amud-agent$' SHA256SUMS
          grep -qE '[[:space:]/]amud-server-arm64$' SHA256SUMS
          grep -qE '[[:space:]/]amud-agent-arm64$' SHA256SUMS
          grep -qE '[[:space:]/]ui\.tar\.gz$' SHA256SUMS

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: |
            dist/amud-server
            dist/amud-agent
            dist/amud-server-arm64
            dist/amud-agent-arm64
            dist/ui.tar.gz
            dist/SHA256SUMS
            setup-amud.sh
            update-amud.sh
            uninstall-amud.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
