# Dependabot: low-noise security/maintenance updates for a homelab project.
# Weekly floods of major-version PRs are disabled; review monthly instead.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 3
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 1
