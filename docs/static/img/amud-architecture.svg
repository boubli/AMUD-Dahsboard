<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131a" />
      <stop offset="100%" stop-color="#1a1b26" />
    </linearGradient>
    <linearGradient id="client-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d59a1" />
      <stop offset="100%" stop-color="#7aa2f7" />
    </linearGradient>
    <linearGradient id="server-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007c" />
      <stop offset="100%" stop-color="#ff9e64" />
    </linearGradient>
    <linearGradient id="agent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0db9d7" />
      <stop offset="100%" stop-color="#9ece6a" />
    </linearGradient>
    <linearGradient id="socket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b4f9f8" />
      <stop offset="100%" stop-color="#2ac3de" />
    </linearGradient>
    <linearGradient id="pve-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0af68" />
      <stop offset="100%" stop-color="#ff9e64" />
    </linearGradient>

    <!-- Filters for Glow and Shadow -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Marker for Arrows -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7aa2f7" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff9e64" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#9ece6a" />
    </marker>
  </defs>

  <!-- Background Card -->
  <rect width="900" height="500" rx="16" fill="url(#bg-grad)" stroke="#24283b" stroke-width="2" filter="url(#drop-shadow)" />
  
  <!-- Grid Pattern Overlay -->
  <g opacity="0.05">
    <path d="M 0,50 L 900,50 M 0,100 L 900,100 M 0,150 L 900,150 M 0,200 L 900,200 M 0,250 L 900,250 M 0,300 L 900,300 M 0,355 L 900,355 M 0,400 L 900,400 M 0,450 L 900,450" fill="none" stroke="#c0caf5" stroke-width="1" />
    <path d="M 100,0 L 100,500 M 200,0 L 200,500 M 300,0 L 300,500 M 400,0 L 400,500 M 500,0 L 500,500 M 600,0 L 600,500 M 700,0 L 700,500 M 800,0 L 800,500" fill="none" stroke="#c0caf5" stroke-width="1" />
  </g>

  <!-- ==================== PROXMOX HOST BOUNDARY ==================== -->
  <rect x="290" y="40" width="570" height="420" rx="12" fill="none" stroke="#414868" stroke-width="2" stroke-dasharray="8 4" />
  <text x="310" y="30" fill="#a9b1d6" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">PROXMOX VE HYPERVISOR (HOST)</text>

  <!-- ==================== LXC CONTAINER BOUNDARY ==================== -->
  <rect x="320" y="70" width="230" height="360" rx="10" fill="#16161e" fill-opacity="0.8" stroke="#3b4261" stroke-width="2" />
  <text x="335" y="95" fill="#c0caf5" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">LXC Container (amud-dashboard)</text>
  <text x="335" y="112" fill="#565f89" font-family="system-ui, sans-serif" font-size="10">amud-dashboard</text>

  <!-- ==================== CLIENT BROWSER ==================== -->
  <g transform="translate(40, 160)" filter="url(#drop-shadow)">
    <rect width="180" height="150" rx="10" fill="#1f2335" stroke="url(#client-grad)" stroke-width="2" />
    <rect width="180" height="25" rx="10" fill="#1a1b26" />
    <!-- Browser window dots -->
    <circle cx="15" cy="12" r="4" fill="#f7768e" />
    <circle cx="28" cy="12" r="4" fill="#e0af68" />
    <circle cx="41" cy="12" r="4" fill="#9ece6a" />
    <!-- Browser Content -->
    <text x="90" y="65" fill="#c0caf5" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Client Browser</text>
    <text x="90" y="85" fill="#a9b1d6" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Alpine.js + Live WebSockets</text>
    <!-- Small dashboard representation -->
    <rect x="20" y="105" width="40" height="25" rx="3" fill="#24283b" stroke="#3b4261" />
    <rect x="70" y="105" width="40" height="25" rx="3" fill="#24283b" stroke="#3b4261" />
    <rect x="120" y="105" width="40" height="25" rx="3" fill="#24283b" stroke="#3b4261" />
    <circle cx="40" cy="117" r="3" fill="#9ece6a" />
    <circle cx="90" cy="117" r="3" fill="#9ece6a" />
    <circle cx="140" cy="117" r="3" fill="#f7768e" />
  </g>

  <!-- ==================== AMUD SERVER (INSIDE LXC) ==================== -->
  <g transform="translate(345, 140)" filter="url(#drop-shadow)">
    <rect width="180" height="130" rx="8" fill="#1f2335" stroke="url(#server-grad)" stroke-width="2" />
    <text x="90" y="35" fill="#ff9e64" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">amud-server</text>
    <text x="90" y="52" fill="#565f89" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Rust / Axum Engine</text>
    <!-- Server specs / features -->
    <rect x="15" y="68" width="150" height="48" rx="4" fill="#1a1b26" stroke="#24283b" />
    <text x="25" y="83" fill="#787c99" font-family="system-ui, sans-serif" font-size="10">▪ Serves Static UI Assets</text>
    <text x="25" y="97" fill="#787c99" font-family="system-ui, sans-serif" font-size="10">▪ Handles WS Connections</text>
    <text x="25" y="110" fill="#787c99" font-family="system-ui, sans-serif" font-size="10">▪ Telemetry Hub (Tokio)</text>
  </g>

  <!-- SQLite Database (inside LXC) -->
  <g transform="translate(375, 330)" filter="url(#drop-shadow)">
    <rect width="120" height="70" rx="6" fill="#1f2335" stroke="#3b4261" stroke-width="1.5" />
    <!-- Cylinder representation -->
    <path d="M 25,25 C 25,18 95,18 95,25 C 95,32 25,32 25,25 Z" fill="#24283b" stroke="#7aa2f7" stroke-width="1.5" />
    <path d="M 25,25 L 25,50 C 25,57 95,57 95,50 L 95,25" fill="none" stroke="#7aa2f7" stroke-width="1.5" />
    <path d="M 25,37 C 25,44 95,44 95,37" fill="none" stroke="#7aa2f7" stroke-width="1.5" />
    <text x="60" y="14" fill="#a9b1d6" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">SQLite DB</text>
    <text x="60" y="62" fill="#565f89" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">amud.db (Data store)</text>
  </g>
  
  <!-- Link Server & DB -->
  <path d="M 435,270 L 435,330" fill="none" stroke="#565f89" stroke-width="2" stroke-dasharray="3 3" />

  <!-- ==================== IPC UNIX DOMAIN SOCKET ==================== -->
  <g transform="translate(585, 175)" filter="url(#drop-shadow)">
    <rect width="70" height="150" rx="35" fill="#1a1b26" stroke="url(#socket-grad)" stroke-width="2.5" />
    <!-- Socket Text -->
    <text x="35" y="45" fill="#2ac3de" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">UNIX</text>
    <text x="35" y="60" fill="#2ac3de" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SOCKET</text>
    <circle cx="35" cy="95" r="14" fill="#2ac3de" fill-opacity="0.1" stroke="#2ac3de" stroke-width="1" />
    <text x="35" y="99" fill="#b4f9f8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">amud</text>
    <text x="35" y="125" fill="#565f89" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Bind-Mount</text>
  </g>

  <!-- ==================== AMUD AGENT (ON HOST) ==================== -->
  <g transform="translate(685, 140)" filter="url(#drop-shadow)">
    <rect width="150" height="130" rx="8" fill="#1f2335" stroke="url(#agent-grad)" stroke-width="2" />
    <text x="75" y="35" fill="#9ece6a" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">amud-agent</text>
    <text x="75" y="52" fill="#565f89" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Rust Telemetry Agent</text>
    <!-- Agent features -->
    <rect x="12" y="68" width="126" height="48" rx="4" fill="#1a1b26" stroke="#24283b" />
    <text x="20" y="83" fill="#787c99" font-family="system-ui, sans-serif" font-size="10">▪ Sysinfo (Host CPU/RAM)</text>
    <text x="20" y="97" fill="#787c99" font-family="system-ui, sans-serif" font-size="10">▪ Proxmox REST API Client</text>
    <text x="20" y="110" fill="#787c99" font-family="system-ui, sans-serif" font-size="10">▪ Streams container stats</text>
  </g>

  <!-- Proxmox API / Host OS Nodes -->
  <g transform="translate(685, 330)" filter="url(#drop-shadow)">
    <!-- Proxmox VE API Box -->
    <rect width="150" height="70" rx="6" fill="#24283b" stroke="url(#pve-grad)" stroke-width="1.5" />
    <text x="75" y="28" fill="#ff9e64" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Proxmox VE API</text>
    <text x="75" y="45" fill="#a9b1d6" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Token Auth (root@pam!amud)</text>
    <text x="75" y="58" fill="#565f89" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">VM/LXC status provider</text>
  </g>

  <!-- Link Agent & PVE API -->
  <path d="M 760,270 L 760,330" fill="none" stroke="#9ece6a" stroke-width="2" marker-end="url(#arrow-green)" marker-start="url(#arrow-green)" />

  <!-- ==================== FLOW LINES & LABELS ==================== -->
  
  <!-- HTTP & WebSocket Connection: Browser <-> Server -->
  <path d="M 220,205 L 345,205" fill="none" stroke="#7aa2f7" stroke-width="3" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)" filter="url(#glow-blue)" />
  <text x="282" y="175" fill="#7aa2f7" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">HTTP &amp; WebSockets</text>
  <text x="282" y="193" fill="#a9b1d6" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Port 8000</text>

  <!-- socket stream: Server <-> UNIX Socket -->
  <path d="M 525,205 L 585,205" fill="none" stroke="#2ac3de" stroke-width="3" marker-end="url(#arrow-orange)" marker-start="url(#arrow-orange)" />
  <text x="555" y="195" fill="#a9b1d6" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">IPC</text>

  <!-- socket stream: UNIX Socket <-> Agent -->
  <path d="M 655,205 L 685,205" fill="none" stroke="#2ac3de" stroke-width="3" marker-end="url(#arrow-green)" marker-start="url(#arrow-green)" />
  <text x="670" y="195" fill="#a9b1d6" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">IPC</text>

</svg>
